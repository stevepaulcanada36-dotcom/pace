name: PaceSense tests

on:
  pull_request:
    branches: [deploy/render, main]
  push:
    branches: [deploy/render, main, feature/boson-ai]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,studio,dashboard]"
      - name: Run test suite
        run: python -m unittest discover -s tests -t .
