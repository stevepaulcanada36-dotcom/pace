# Runs the tests on every push, then proves the pipeline is reproducible:
# two independent runs of `pacesense reproduce --quick` must produce identical output hashes.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -t .
      - run: pacesense reproduce --quick --out run1
      - run: pacesense reproduce --check run1/manifest.json
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: reproduce-manifest
          path: run1/manifest.json
