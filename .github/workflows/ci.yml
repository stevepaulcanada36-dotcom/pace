# Validate the Python matrix, application quality, live Boson connection (when configured), and container startup.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

# Avoid overlapping runs for the same branch consuming the hosted-runner allowance.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[studio,dev]"
      - run: python -m unittest discover -s tests -t .
      - run: pacesense reproduce --quick --out run1
      - run: pacesense reproduce --check run1/manifest.json
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: reproduce-manifest
          path: run1/manifest.json

  quality:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[studio,dev]"
      - run: ruff check src/pacesense/studio src/pacesense/adaptive src/pacesense/hud/voice_actions.py tests/test_studio.py tests/test_adaptive.py tests/test_voice_assistant.py tests/test_voice_actions.py tests/asgi.py
      - run: mypy src/pacesense/studio src/pacesense/adaptive src/pacesense/hud/voice_actions.py
      - run: node --check src/pacesense/studio/static/studio.js
      - run: node --check src/pacesense/studio/static/adaptive.js
      - run: ruff check src/pacesense/llm/boson.py tests/test_boson.py scripts/check_boson_realtime.py
      - name: Boson Realtime live smoke test
        env:
          BOSON_API_KEY: ${{ secrets.BOSON_API_KEY }}
        run: |
          if [ -n "$BOSON_API_KEY" ]; then
            python scripts/check_boson_realtime.py --output /tmp/boson-realtime-test.wav
          else
            echo "SKIP: BOSON_API_KEY repository secret is not configured."
          fi
      - name: Server smoke test
        run: |
          pacesense studio --no-browser --port 8765 --db /tmp/ci.sqlite3 &
          for i in $(seq 1 30); do curl -sf localhost:8765/readyz && break; sleep 1; done
          curl -sf localhost:8765/ | grep -q "PaceSense Studio"
          SID=$(curl -sf -X POST localhost:8765/api/v1/sessions -H 'content-type: application/json' -d '{}' | python -c "import sys,json;print(json.load(sys.stdin)['id'])")
          curl -sf -X POST localhost:8765/api/v1/sessions/$SID/commands -H 'content-type: application/json' -d '{"text":"trust the recent races more"}' > /dev/null

  docker:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pacesense .
      - run: |
          docker run -d -p 8000:8000 --name ps pacesense
          for i in $(seq 1 40); do curl -sf localhost:8000/readyz && exit 0; sleep 1; done; docker logs ps; exit 1
