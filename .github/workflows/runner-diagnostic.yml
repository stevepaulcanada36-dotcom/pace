name: runner diagnostic
on:
  push:
    branches: [feature/boson-ai]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm GitHub-hosted runner allocation
        run: |
          echo "GitHub-hosted runner successfully started."
          uname -a
          python --version
