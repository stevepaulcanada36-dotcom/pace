# Central, non-secret PaceSense configuration.
# Edit model IDs here instead of scattering them through Python files.
openrouter:
  base_url: "https://openrouter.ai/api/v1"
  app_name: "PaceSense"
  app_url: null

models:
  assistant:
    model: "openai/gpt-4o-mini"
    temperature: 0.2
  transcribe:
    model: "openai/whisper-1"
    temperature: 0.0
  extract:
    model: "openai/gpt-4o-mini"
    temperature: 0.0
  refine:
    model: "openai/gpt-4o-mini"
    temperature: 0.3

voice:
  transcription_backend: "local"
  local_whisper_model: "base"
  language: null

# One seed for everything random: synthetic data, validation samples, the recency fit, study assignment
# and simulated coaches. `pacesense reproduce` records it in results/manifest.json.
reproducibility:
  seed: 20240318

# Race-day simulator (command center). These are stated assumptions, not fitted on data; see src/pacesense/hud/sim.py.
simulator:
  heat_start_c: 11      # no heat effect at or below this temperature
  heat_pct_per_c: 0.30  # average slowdown per °C above it (about 4 % at 25 °C)
  wind_pct: 0.05        # headwind cost: wind_pct * (m/s)^2, halved for a course that is not all into the wind
